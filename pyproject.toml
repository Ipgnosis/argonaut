[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argonaut"
version = "0.5.1"
description = "A small module (Argo), for loading, validating, pretty-printing, and inspecting the structure of a JSON file."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Russell Bennett", email = "russell@beanbazaar.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/Ipgnosis/argonaut"
Issues = "https://github.com/Ipgnosis/argonaut/issues"

[tool.setuptools]
py-modules = ["argo", "file_ops"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
ignore_missing_imports = true
